<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>读书笔记</title>
<meta name="description" content="我的读书笔记 —— 持续记录与分享。" />
<script src="./marked.min.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --bg-soft: #161a22;
    --card: #1b202b;
    --border: #2a3140;
    --text: #e7ecf3;
    --muted: #9aa6b8;
    --accent: #5b8cff;
    --accent-2: #8a6bff;
    --radius: 16px;
    --maxw: 920px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: radial-gradient(1000px 500px at 80% -10%, #1c2540 0%, transparent 60%),
      radial-gradient(800px 460px at -10% 10%, #241b40 0%, transparent 55%), var(--bg);
    color: var(--text);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 24px; }

  nav { position: sticky; top: 0; z-index: 50; backdrop-filter: blur(10px);
    background: rgba(15,17,21,.7); border-bottom: 1px solid var(--border); }
  nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 62px; }
  .brand { font-weight: 700; letter-spacing: .5px; font-size: 18px; }
  .brand span { color: var(--accent); }
  .nav-links { display: flex; gap: 22px; font-size: 14px; color: var(--muted); }
  .nav-links a:hover { color: var(--text); }

  header.hero { padding: 80px 0 36px; text-align: center; }
  .hero h1 { font-size: clamp(30px, 5vw, 48px); margin: 0 0 14px; }
  .hero h1 .grad { background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p { color: var(--muted); margin: 0 auto 28px; max-width: 560px; }
  .search { max-width: 480px; margin: 0 auto; }
  .search input {
    width: 100%; padding: 13px 18px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--bg-soft); color: var(--text); font-size: 15px; outline: none;
  }
  .search input:focus { border-color: var(--accent); }

  .tags-bar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 28px 0 8px; }
  .tag-btn {
    font-size: 13px; color: var(--muted); border: 1px solid var(--border);
    background: var(--bg-soft); padding: 6px 14px; border-radius: 999px; cursor: pointer;
    transition: all .15s ease;
  }
  .tag-btn:hover { color: var(--text); border-color: var(--accent); }
  .tag-btn.active { background: linear-gradient(90deg, var(--accent), var(--accent-2));
    color: #fff; border: none; }

  main { padding: 32px 0 64px; }
  .count { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .loading { text-align: center; color: var(--muted); padding: 50px 0; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 22px; cursor: pointer; transition: transform .18s ease, border-color .18s ease;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .card:hover { transform: translateY(-4px); border-color: var(--accent); }
  .card .cover { width: calc(100% + 44px); margin: -22px -22px 16px; height: 170px; object-fit: cover; }
  .card h3 { margin: 0 0 8px; font-size: 18px; line-height: 1.4; }
  .card .meta { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .card .summary { color: var(--muted); font-size: 14px; flex: 1; }
  .card .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .pill { font-size: 11px; color: var(--muted); border: 1px solid var(--border); padding: 2px 9px; border-radius: 999px; }

  .empty { text-align: center; color: var(--muted); padding: 60px 0; }

  /* Detail */
  .detail { display: none; }
  .detail.show { display: block; }
  .back { display: inline-flex; align-items: center; gap: 6px; color: var(--accent);
    font-size: 14px; cursor: pointer; margin-bottom: 22px; }
  .detail h1 { font-size: clamp(26px, 4vw, 38px); margin: 0 0 10px; line-height: 1.3; }
  .detail .meta { color: var(--muted); font-size: 14px; margin-bottom: 14px; }
  .detail .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
  .detail-content { color: #d7deea; font-size: 16px; }
  .detail-content p { margin: 0 0 18px; }
  .detail-content h2 { font-size: 22px; margin: 30px 0 14px; color: var(--text); }
  .detail-content h3 { font-size: 18px; margin: 24px 0 12px; color: var(--text); }
  .detail-content ul, .detail-content ol { margin: 0 0 18px; padding-left: 22px; }
  .detail-content li { margin: 6px 0; }
  .detail-content blockquote { margin: 0 0 18px; padding: 10px 18px; border-left: 3px solid var(--accent);
    background: var(--bg-soft); color: var(--muted); border-radius: 0 8px 8px 0; }
  .detail-content code { background: var(--bg-soft); padding: 2px 6px; border-radius: 6px; font-size: 14px; }
  .detail-content pre { background: var(--bg-soft); padding: 16px; border-radius: 10px; overflow: auto; }
  .detail-content pre code { background: none; padding: 0; }
  .detail-content img { max-width: 100%; height: auto; border-radius: 10px; margin: 16px 0; display: block; }

  footer { padding: 36px 0; color: var(--muted); font-size: 13px; text-align: center;
    border-top: 1px solid var(--border); }
  footer a { color: var(--accent); }

  @media (max-width: 640px) { .nav-links { display: none; } }
</style>
</head>
<body>
  <nav>
    <div class="wrap">
      <div class="brand">读书<span>笔记</span></div>
      <div class="nav-links">
        <a href="#/" id="nav-home">首页</a>
        <a href="https://github.com/hipzz/hipzz.github.io" target="_blank" rel="noopener">在 GitHub 编辑</a>
      </div>
    </div>
  </nav>

  <div class="wrap">
    <div id="list-view">
      <header class="hero">
        <h1>我的<span class="grad">读书笔记</span></h1>
        <p>记录读过的书，留下的思考。每篇都是一份 Markdown，持续更新中。</p>
        <div class="search"><input id="search" type="text" placeholder="搜索书名、作者或标签…" /></div>
        <div class="tags-bar" id="tags-bar"></div>
      </header>
      <main>
        <div class="count" id="count"></div>
        <div class="grid" id="grid"></div>
        <div class="empty" id="empty" style="display:none;">没有匹配的笔记，换个关键词试试。</div>
      </main>
    </div>

    <div id="detail-view" class="detail">
      <main style="padding-top:40px;">
        <div class="back" id="back">← 返回列表</div>
        <h1 id="d-title"></h1>
        <div class="meta" id="d-meta"></div>
        <div class="tags" id="d-tags"></div>
        <div class="detail-content" id="d-content"></div>
      </main>
    </div>
  </div>

  <footer>
    <div class="wrap">© <span id="year"></span> 读书笔记 · 由 GitHub Pages 托管 · <a href="https://github.com/hipzz/hipzz.github.io" target="_blank" rel="noopener">编辑内容</a></div>
  </footer>

  <script>
    const state = { all: [], tag: "全部", q: "" };

    function parseFM(text) {
      const m = text.match(/^---\s*\n([\s\S]*?)\n---\s*\n?([\s\S]*)$/);
      if (!m) return { meta: {}, body: text };
      const meta = {};
      m[1].split("\n").forEach(line => {
        const i = line.indexOf(":");
        if (i < 0) return;
        const k = line.slice(0, i).trim();
        let v = line.slice(i + 1).trim();
        if (v.startsWith("[") && v.endsWith("]")) {
          v = v.slice(1, -1).split(",").map(s => s.trim().replace(/^["']|["']$/g, "")).filter(Boolean);
        }
        if (k) meta[k] = v;
      });
      return { meta, body: m[2] };
    }

    async function load() {
      const grid = document.getElementById("grid");
      grid.innerHTML = '<div class="loading">正在加载读书笔记…</div>';
      try {
        const idx = await (await fetch("notes.json")).json();
        state.all = [];
        for (const file of (idx.notes || [])) {
          const text = await (await fetch(file)).text();
          const { meta, body } = parseFM(text);
          state.all.push({ file, meta, body });
        }
      } catch (e) {
        grid.innerHTML = '<div class="loading">加载失败，请确认通过 http(s) 访问本页面（而非直接双击打开）。</div>';
        return;
      }
      renderTags();
      route();
      window.addEventListener("hashchange", route);
    }

    function allTags() {
      const set = new Set();
      state.all.forEach(n => (n.meta.tags || []).forEach(t => set.add(t)));
      return ["全部", ...set];
    }

    function renderTags() {
      const bar = document.getElementById("tags-bar");
      bar.innerHTML = "";
      allTags().forEach(t => {
        const b = document.createElement("button");
        b.className = "tag-btn" + (t === state.tag ? " active" : "");
        b.textContent = t;
        b.onclick = () => { state.tag = t; renderTags(); renderList(); };
        bar.appendChild(b);
      });
    }

    function filtered() {
      const q = state.q.trim().toLowerCase();
      return state.all.filter(n => {
        const okTag = state.tag === "全部" || (n.meta.tags || []).includes(state.tag);
        const hay = (n.meta.title + " " + (n.meta.author || "") + " " + (n.meta.tags || []).join(" ")).toLowerCase();
        const okQ = !q || hay.includes(q);
        return okTag && okQ;
      });
    }

    function renderList() {
      const grid = document.getElementById("grid");
      const list = filtered().slice().sort((a, b) => (b.meta.date || "").localeCompare(a.meta.date || ""));
      document.getElementById("count").textContent = "共 " + list.length + " 篇读书笔记";
      document.getElementById("empty").style.display = list.length ? "none" : "block";
      grid.innerHTML = "";
      list.forEach(n => {
        const card = document.createElement("div");
        card.className = "card";
        const cover = n.meta.cover ? '<img class="cover" src="' + escAttr(n.meta.cover) + '" alt="">' : "";
        const tags = (n.meta.tags || []).map(t => '<span class="pill">' + esc(t) + "</span>").join("");
        card.innerHTML = cover +
          "<h3>" + esc(n.meta.title || "无标题") + "</h3>" +
          '<div class="meta">' + esc(n.meta.author || "") + " · " + esc(n.meta.date || "") + "</div>" +
          '<div class="summary">' + esc(n.meta.summary || "") + "</div>" +
          '<div class="tags">' + tags + "</div>";
        card.onclick = () => (location.hash = "#/note/" + encodeURIComponent(n.file));
        grid.appendChild(card);
      });
    }

    function renderDetail(file) {
      const n = state.all.find(x => x.file === file);
      const dv = document.getElementById("detail-view");
      const lv = document.getElementById("list-view");
      if (!n) { location.hash = "#/"; return; }
      document.getElementById("d-title").textContent = n.meta.title || "无标题";
      document.getElementById("d-meta").textContent =
        (n.meta.author || "") + (n.meta.date ? "  ·  " + n.meta.date : "");
      document.getElementById("d-tags").innerHTML =
        (n.meta.tags || []).map(t => '<span class="pill">' + esc(t) + "</span>").join("");
      document.getElementById("d-content").innerHTML = marked.parse(n.body || "");
      lv.style.display = "none";
      dv.classList.add("show");
      window.scrollTo(0, 0);
    }

    function route() {
      const lv = document.getElementById("list-view");
      const dv = document.getElementById("detail-view");
      const h = location.hash || "#/";
      const m = h.match(/^#\/note\/(.+)$/);
      if (m) {
        renderDetail(decodeURIComponent(m[1]));
      } else {
        lv.style.display = "block";
        dv.classList.remove("show");
        renderList();
      }
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function escAttr(s) { return esc(s); }

    document.getElementById("search").addEventListener("input", e => {
      state.q = e.target.value;
      renderList();
    });
    document.getElementById("back").onclick = () => (location.hash = "#/");
    document.getElementById("nav-home").onclick = () => (location.hash = "#/");
    document.getElementById("year").textContent = new Date().getFullYear();

    load();
  </script>
</body>
</html>
